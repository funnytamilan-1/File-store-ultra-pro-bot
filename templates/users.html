{% extends "layout.html" %}
{% block content %}
<header class="page-header"><p class="eyebrow">AUDIENCE</p><h1>Registered Users</h1><p>Latest 200 active user records.</p></header>
<div class="panel"><input id="userSearch" type="search" placeholder="Search user IDs…" oninput="filterTable('userSearch','usersTable')"><table id="usersTable"><thead><tr><th>Telegram user ID</th><th>Joined</th><th>Last seen</th></tr></thead><tbody>
{% for user in users %}<tr><td>{{ user.user_id }}</td><td>{{ user.joined_at or '—' }}</td><td>{{ user.last_seen or '—' }}</td></tr>{% else %}<tr><td colspan="3">No users found.</td></tr>{% endfor %}
</tbody></table></div>
{% endblock %}
