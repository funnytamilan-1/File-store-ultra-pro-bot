<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>File Store Admin Login</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">
<form method="POST" class="login-box">
    <h2>File Store Admin</h2>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}<p class="flash {{ category }}">{{ message }}</p>{% endfor %}
    {% endwith %}
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="password">Admin password</label>
    <input id="password" type="password" name="password" placeholder="Enter password" autocomplete="current-password" required>
    <button type="submit">Sign in</button>
</form>
</body>
</html>
